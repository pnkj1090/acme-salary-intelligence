services:
  - type: web
    name: acme-salary-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://acme-salary-intelligence.vercel.app

databases:
  - name: acme-salary-db
    databaseName: acme_salary
    user: acme_user
    plan: starter
